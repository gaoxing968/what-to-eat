<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0f0f1a;
  color: #fff;
  font-family: -apple-system, 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
}

/* ===== 顶部标题 ===== */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  background: rgba(15,15,26,0.95);
  z-index: 10;
  padding: 14px 20px 10px;
}
.header .title {
  text-align: center;
  font-size: 44px;
  font-weight: bold;
  color: #fff;
  margin-bottom: 8px;
}
.header .title span { color: #e74c3c; }
.header .header-status {
  display: flex;
  justify-content: center;
  gap: 24px;
  font-size: 18px;
  color: #888;
}
.header .header-status .remain { color: #e74c3c; font-weight: bold; }
.header .header-status .badges { color: #f39c12; cursor: pointer; }

/* ===== 转盘容器 ===== */
.wheel-wrapper {
  position: relative;
  width: min(92vw, 460px);
  height: min(92vw, 460px);
  margin-top: 60px;
}
canvas#wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  box-shadow: 0 0 40px rgba(231,76,60,0.3);
  cursor: pointer;
  transition: box-shadow 0.3s;
}
canvas#wheel.spinning {
  box-shadow: 0 0 60px rgba(231,76,60,0.6);
}

/* 中心按钮 */
.spin-btn {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 110px; height: 110px;
  border-radius: 50%;
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  border: none;
  color: #fff;
  font-size: 32px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(231,76,60,0.5);
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.spin-btn.hidden { display: none; }

/* 指针 */
.pointer {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-top: 28px solid #f39c12;
  z-index: 6;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
}

/* ===== 心情选择 ===== */
.mood-picker {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15,15,26,0.95);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.mood-picker.show { display: flex; }
.mood-picker h2 {
  font-size: 30px;
  margin-bottom: 8px;
  color: #f39c12;
}
.mood-picker p {
  color: #888;
  font-size: 28px;
  margin-bottom: 28px;
}
.mood-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  max-width: 360px;
}
.mood-btn {
  background: #1a1a2e;
  border: 2px solid #2c3e50;
  border-radius: 16px;
  padding: 18px 12px;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.mood-btn .emoji { font-size: 32px; }
.mood-btn .label { font-size: 28px; color: #bdc3c7; }
.mood-btn .desc { font-size: 11px; color: #666; }
.mood-btn:hover, .mood-btn.selected {
  border-color: #e74c3c;
  background: #1a1a2e;
  box-shadow: 0 0 16px rgba(231,76,60,0.3);
}
.mood-btn.selected { border-color: #f39c12; }

/* ===== 灵魂拷问 ===== */
.question-box {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15,15,26,0.97);
  z-index: 101;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
}
.question-box.show { display: flex; }
.question-box .q-emoji { font-size: 48px; margin-bottom: 20px; }
.question-box .q-text {
  font-size: 28px;
  color: #fff;
  text-align: center;
  margin-bottom: 28px;
  line-height: 1.6;
}
.question-box input {
  background: #1a1a2e;
  border: 2px solid #2c3e50;
  border-radius: 12px;
  padding: 14px 20px;
  color: #fff;
  font-size: 20px;
  width: 100%;
  max-width: 340px;
  text-align: center;
  outline: none;
  margin-bottom: 20px;
}
.question-box input:focus { border-color: #e74c3c; }
.question-box input::placeholder { color: #555; }

/* ===== 按钮样式 ===== */
.btn-primary {
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  border: none;
  border-radius: 12px;
  padding: 14px 40px;
  color: #fff;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(231,76,60,0.4);
  transition: transform 0.1s;
}
.btn-primary:active { transform: scale(0.97); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-secondary {
  background: #2c3e50;
  border: none;
  border-radius: 10px;
  padding: 10px 24px;
  color: #bdc3c7;
  font-size: 28px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-secondary:hover { background: #34495e; color: #fff; }

/* ===== 结果弹窗 ===== */
.result-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15,15,26,0.95);
  z-index: 200;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.result-modal.show { display: flex; }

/* 结果卡片 */
.result-card {
  background: #1a1a2e;
  border-radius: 24px;
  padding: 32px 24px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  border: 2px solid #2c3e50;
}
.result-card .card-header {
  font-size: 18px;
  color: #666;
  margin-bottom: 16px;
}
.result-card .result-food {
  font-size: 28px;
  font-weight: bold;
  color: #f39c12;
  margin-bottom: 8px;
  word-break: keep-all;
}
.result-card .result-mood {
  font-size: 18px;
  color: #888;
  margin-bottom: 20px;
}
.result-card .result-mood span { color: #e74c3c; }
.result-card .radar {
  background: #0f0f1a;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 20px;
  font-size: 18px;
  color: #888;
}
.result-card .radar .count { color: #e74c3c; font-weight: bold; }
.result-card .card-footer {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.result-card .card-footer button {
  border-radius: 10px;
  padding: 10px 20px;
  font-size: 28px;
  border: none;
  cursor: pointer;
  transition: transform 0.1s;
}
.result-card .card-footer button:active { transform: scale(0.96); }
.result-card .card-footer .save-btn {
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  color: #fff;
}
.result-card .card-footer .again-btn {
  background: #2c3e50;
  color: #bdc3c7;
}
.result-card .card-footer .close-btn {
  background: transparent;
  color: #555;
  border: 1px solid #333;
}

/* ===== 成就徽章 ===== */
.badge-toast {
  display: none;
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: #1a1a2e;
  border: 2px solid #f39c12;
  border-radius: 16px;
  padding: 14px 24px;
  z-index: 300;
  text-align: center;
  box-shadow: 0 4px 24px rgba(243,156,18,0.3);

}
.badge-toast.show { display: block; }
.badge-toast .badge-name { color: #f39c12; font-size: 20px; font-weight: bold; }
.badge-toast .badge-desc { color: #888; font-size: 12px; margin-top: 4px; }

@keyframes popIn {
  0% { opacity: 0; transform: translateX(-50%) scale(0.8); }
  100% { opacity: 1; transform: translateX(-50%) scale(1); }
}

/* ===== 底部统计栏 ===== */
.footer-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(15,15,26,0.95);
  padding: 10px 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 12px;
  color: #555;
  z-index: 10;
}

/* ===== 转盘说明文字 ===== */
.badge-page {
  display: none;
  position: fixed;
  inset: 0;
  background: #0f0f1a;
  z-index: 150;
  flex-direction: column;
  padding: 20px;
  overflow-y: auto;
}
.badge-page.show { display: flex; }
.badge-page h2 { text-align: center; color: #f39c12; margin: 16px 0 24px; }
.badge-list { display: flex; flex-direction: column; gap: 12px; }
.badge-item {
  background: #1a1a2e;
  border-radius: 14px;
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 14px;

}
.badge-item.locked { opacity: 0.4; }
.badge-item .b-icon { font-size: 32px; }
.badge-item .b-info .b-name { color: #f39c12; font-weight: bold; font-size: 18px; }
.badge-item .b-info .b-desc { color: #888; font-size: 12px; margin-top: 2px; }
.badge-item .b-info .b-progress { color: #555; font-size: 11px; margin-top: 4px; }
.badge-item .b-info .b-progress.done { color: #27ae60; }
.back-btn {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);

  border-radius: 24px;

/* ===== 转盘说明文字 ===== */
.hint {
  margin-top: 20px;
  font-size: 18px;
  color: #555;
  text-align: center;
}
</style>

<body>

<!-- 顶部 -->
<div class="header">

<!-- 转盘 -->

<!-- 灵魂拷问 -->

</div>

<!-- 结果弹窗 -->
<div class="result-modal" id="resultModal">
  <div class="result-card" id="resultCard">
    <div class="card-header" id="cardHeader"></div>
    <div class="result-food" id="resultFood"></div>
    <div class="result-mood" id="resultMood"></div>

      <button class="save-btn" id="saveCardBtn">📥 保存卡片</button>
      <button class="again-btn" id="againBtn">再转一次</button>
      <button class="close-btn" id="closeResultBtn">关闭</button>
    </div>
  </div>
</div>

<!-- 成就徽章提示 -->
<div class="badge-toast" id="badgeToast">
  <div class="badge-name" id="badgeToastName"></div>
  <div class="badge-desc" id="badgeToastDesc"></div>
</div>

<!-- 成就页面 -->
<div class="badge-page" id="badgePage">
  <h2>🏆 吃货成就</h2>
  <div class="badge-list" id="badgeList"></div>
  <button class="back-btn" id="backBtn">返回</button>
</div>

<!-- 底部状态栏 -->
<div class="footer-bar">
  <span>Made by luckycat  ·  luckycat168968@gmail.com</span>
</div>

<script>
// ==================== 数据 ====================
const FOOD_POOLS = {
  work: [
    '叉烧饭','炒河粉','麻辣烫','炸鸡','黄焖鸡','咖喱鱼蛋',
    '煲仔饭','煎饺','生煎包','锅贴','手抓饼','煎饼果子',
    '炒饭','炒粉丝','酸辣粉','麻辣香锅','卤肉饭','烧鸭饭',
    '盖浇饭','炒面','铁板炒饭','烤肉拌饭','麻辣拌','鸡公煲'
  ],
  slack: [
    '炒饭','炒粉','泡面','炒方便面','蛋炒饭','葱油拌面',
    '热干面','凉面','焖面','烩面','油泼面','片儿川',
    '拌面','拉条子','炒饼','煎饼','鸡蛋灌饼','手抓饼',
    '肉夹馍','肠粉','糯米鸡','烧麦','小笼包','蒸饺'
  ],
  social: [
    '火锅','烤鱼','麻辣香锅','串串','冒菜','酸菜鱼',
    '水煮鱼','烧烤','自助餐','小龙虾','牛蛙','鸡爪煲',
    '砂锅粥','椰子鸡','潮汕牛肉','打边炉','酱大骨','猪肚鸡',
    '日料','韩式烤肉','泰式料理','咖喱饭','越南火锅','铜锅涮肉'
  ],
  solo: [
    '拉面','兰州拉面','重庆小面','越南粉','煲仔饭','红烧牛肉面',
    '担担面','酸辣粉','小笼包','馄饨','砂锅粥','日式定食',
    '乌冬面','味噌拉面','叉烧拉面','咖喱乌冬','鱼生饭','鳗鱼饭',
    '三明治','沙拉','越南三明治','蛋包饭','肥牛饭','温泉蛋'
  ]
};

const QUESTIONS = [
  '你上一次饿着睡着是什么时候？',
  '如果只能吃一种菜吃一周，你选什么？',
  '今天愿意为吃走多远？',
  '你上次吃撑是因为什么？',
  '深夜最想吃什么？',
  '你最推荐的食堂窗口是哪家？',
  '如果明天就要离开这座城市，最后吃一顿，你选什么？',
  '什么食物能瞬间让你心情变好？'
];

const BADGES = [
  { id: 'spicy_new', name: '🌶️ 川菜新手', desc: '转到5种不同的川菜', check: (h) => countCategory(h, '川菜,麻辣,酸菜鱼,水煮鱼,麻辣香锅,冒菜,串串,辣') >= 5 },
  { id: 'carb_king', name: '🥜 碳水控', desc: '转到5次炒饭/炒粉/拌面', check: (h) => countCategory(h, '炒饭,炒粉,拌面,炒面,泡面') >= 5 },
  { id: 'noodle_master', name: '🍜 面食终结者', desc: '转到10次面条类', check: (h) => countCategory(h, '面,粉,拉面,重庆小面,担担面,热干面,乌冬') >= 10 },
  { id: 'fate_gambler', name: '🎰 命运赌徒', desc: '转动转盘50次', check: (h) => h.totalSpins >= 50 },
  { id: 'lucky_10', name: '🍀 十次幸运', desc: '转动转盘10次', check: (h) => h.totalSpins >= 10 },
  { id: 'diversity', name: '🌈 多元吃货', desc: '尝试过15种不同的菜', check: (h) => uniqueFoods(h).size >= 15 },
  { id: 'repeat_victim', name: '🔁 选择困难', desc: '同一道菜转到3次', check: (h) => Object.values(h.foods || {}).some(c => c >= 3) },
];

const WHEEL_COLORS = [
  '#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db',
  '#9b59b6','#1abc9c','#e91e63','#ff5722','#00bcd4',
  '#8bc34a','#ff9800'
];

const MOOD_LABELS = {
  work: '😤 加班模式',
  slack: '😌 摆烂模式',
  social: '🤝 约会/聚餐',
  solo: '🍽️ 孤独美食家'
};

// ==================== 状态 ====================
let currentMood = null;
let currentFood = '';
let isSpinning = false;
let spinCount = 0;
let history = loadHistory();

// ==================== 工具函数 ====================
function loadHistory() {
  try {
    return JSON.parse(localStorage.getItem('wte_history') || '{"foods":{},"totalSpins":0,"lastDate":""}');
  } catch { return { foods: {}, totalSpins: 0, lastDate: '' }; }
}

function saveHistory() {
  localStorage.setItem('wte_history', JSON.stringify(history));
}

function getToday() {
  return new Date().toISOString().slice(0, 10);
}

function getTodaySpins() {
  if (history.lastDate !== getToday()) {
    history.lastDate = getToday();
    history.todaySpins = 0;
    saveHistory();
  }
  return history.todaySpins || 0;
}

function incrementSpins() {
  history.totalSpins++;
  history.todaySpins = (history.todaySpins || 0) + 1;
  saveHistory();
}

function recordFood(food) {
  history.foods[food] = (history.foods[food] || 0) + 1;
  saveHistory();
}

function uniqueFoods(h) {
  return new Set(Object.keys(h.foods || {}));
}

function countCategory(h, keywords) {
  let total = 0;
  for (const food of Object.keys(h.foods || {})) {
    if (keywords.split(',').some(k => food.includes(k.trim()))) {
      total += h.foods[food];
    }
  }
  return total;
}

function getRandomItem(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function updateRemainCount() {
  document.getElementById('remainCount').textContent = Math.max(0, 12 - getTodaySpins());
  document.getElementById('badgesBtn').textContent = `🏆 已收集 ${countEarnedBadges()} 个成就`;
}

function countEarnedBadges() {
  return BADGES.filter(b => b.check(history)).length;
}

// ==================== 转盘绘制 ====================
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const centerX = 450, centerY = 450, radius = 420;
let currentAngle = 0; // 当前指针角度（弧度，0=指向上）

// 扇形起始角（用于旋转动画）
let wheelAngle = 0; // 转盘自身的旋转角度

function drawWheel(foods) {
  ctx.clearRect(0, 0, 900, 900);
  const slice = (2 * Math.PI) / foods.length;
  const pointerAngle = -Math.PI / 2; // 指针固定在顶部（-90度）

  for (let i = 0; i < foods.length; i++) {
    const startAngle = i * slice + wheelAngle;
    const endAngle = startAngle + slice;

    // 扇形
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, radius, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
    ctx.fill();

    // 分割线
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(centerX + Math.cos(startAngle) * radius, centerY + Math.sin(startAngle) * radius);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 文字（沿弧线排列）
    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(startAngle + slice / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 26px -apple-system, Microsoft YaHei, sans-serif';
    const text = foods[i];
    ctx.fillText(text, radius - 28, 6);
    ctx.restore();
  }

  // 中心圆
  ctx.beginPath();
  ctx.arc(centerX, centerY, 65, 0, 2 * Math.PI);
  ctx.fillStyle = '#1a1a2e';
  ctx.fill();
  ctx.strokeStyle = '#e74c3c';
  ctx.lineWidth = 5;
  ctx.stroke();
}

// ==================== 旋转逻辑 ====================
function spin() {
  if (isSpinning) return;
  const todaySpins = getTodaySpins();
  // ⚠️ 发布前改回 12
  if (todaySpins >= 12) {
    alert('今天的12次机会用完啦！明天再来 🎲');
    return;
  }

  // 从当前心情池选取12道
  const pool = FOOD_POOLS[currentMood];
  const foods = [];
  const used = new Set();
  while (foods.length < 12 && foods.length < pool.length) {
    const f = getRandomItem(pool);
    if (!used.has(f)) { used.add(f); foods.push(f); }
  }

  // 绘制转盘
  drawWheel(foods);
  document.getElementById('spinBtn').classList.add('hidden');
  document.getElementById('hint').textContent = '🎡 转动中...';
  canvas.classList.add('spinning');

  // 随机结果索引
  const resultIndex = Math.floor(Math.random() * foods.length);
  currentFood = foods[resultIndex];

  // 计算目标角度：
  // 指针在顶部（-PI/2），转盘顺时针转
  // 每个扇形的中央角度
  const slice = (2 * Math.PI) / foods.length;
  // 让第 resultIndex 个扇形的中央停在指针位置（顶部）
  // 扇形 i 的中央角度 = i*slice + slice/2 + wheelAngle
  // 旋转若干圈后使其对准指针（-PI/2）
  const totalSlices = resultIndex + 0.5; // 停在该扇形中央
  const targetAngle = -totalSlices * slice - (Math.PI / 2);
  // 额外加几圈
  const spins = 5 + Math.random() * 3;
  const finalWheelAngle = targetAngle - spins * 2 * Math.PI - wheelAngle;

  isSpinning = true;
  const duration = 6000;
  const start = performance.now();
  const startWheelAngle = wheelAngle;

  // 物理模拟：角速度指数衰减（摩擦力）——快→慢→停止的真实转盘感
  function physicsEase(t) {
    // 指数衰减：ω(t) = ω₀ * e^(-k*t)
    // 通过调整 k 让转盘在 duration 时刚好几乎停止
    const k = 1.2;
    return 1 - Math.exp(-k * t);
  }

  function animate(now) {
    const elapsed = now - start;
    const t = Math.min(elapsed / duration, 1);
    const ease = physicsEase(t);
    wheelAngle = startWheelAngle + finalWheelAngle * ease;
    drawWheel(foods);

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      isSpinning = false;
      canvas.classList.remove('spinning');
      wheelAngle = wheelAngle % (2 * Math.PI);
      showResult(currentFood);
    }
  }
  requestAnimationFrame(animate);
}

// ==================== 结果弹窗 ====================
function showResult(food) {
  recordFood(food);
  incrementSpins();
  updateRemainCount();
  checkBadges();

  const moodLabel = MOOD_LABELS[currentMood];
  const count = history.foods[food] || 1;
  const now = new Date();
  const timeStr = `${now.getMonth()+1}月${now.getDate()}日 ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

  document.getElementById('cardHeader').textContent = timeStr;
  document.getElementById('resultFood').textContent = food;
  document.getElementById('resultMood').innerHTML = `${moodLabel} · <span>${count}</span>次转到这道菜`;
  document.getElementById('radarInfo').innerHTML = count >= 3
    ? `⚠️ 已经吃了${count}次了，今天换个？`
    : `吃货雷达：这是你第 ${count} 次转到「${food}」`;

  document.getElementById('resultModal').classList.add('show');
}

// ==================== 成就系统 ====================
function checkBadges() {
  for (const badge of BADGES) {
    const key = 'badge_' + badge.id;
    if (!localStorage.getItem(key) && badge.check(history)) {
      localStorage.setItem(key, '1');
      showBadgeToast(badge);
    }
  }
}

function showBadgeToast(badge) {
  const toast = document.getElementById('badgeToast');
  document.getElementById('badgeToastName').textContent = badge.name;
  document.getElementById('badgeToastDesc').textContent = badge.desc;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 4000);
}

function renderBadgePage() {
  const list = document.getElementById('badgeList');
  list.innerHTML = '';
  for (const badge of BADGES) {
    const earned = badge.check(history);
    const div = document.createElement('div');
    div.className = 'badge-item' + (earned ? '' : ' locked');
    div.innerHTML = `
      <div class="b-icon">${earned ? '🏆' : '🔒'}</div>
      <div class="b-info">
        <div class="b-name">${badge.name}</div>
        <div class="b-desc">${badge.desc}</div>
        <div class="b-progress ${earned ? 'done' : ''}">${earned ? '✓ 已达成' : '进行中'}</div>
      </div>
    `;
    list.appendChild(div);
  }
}

// ==================== 保存卡片 ====================
function saveCard() {
  const card = document.getElementById('resultCard');
  // 用 html2canvas 方式——创建离屏 canvas 绘制卡片
  const offCanvas = document.createElement('canvas');
  offCanvas.width = 720;
  offCanvas.height = 900;
  const octx = offCanvas.getContext('2d');

  // 背景
  octx.fillStyle = '#1a1a2e';
  octx.fillRect(0, 0, 720, 900);

  // 顶部装饰
  const grad = octx.createLinearGradient(0, 0, 720, 0);
  grad.addColorStop(0, '#e74c3c');
  grad.addColorStop(1, '#f39c12');
  octx.fillStyle = grad;
  octx.fillRect(0, 0, 720, 12);

  // 标题
  octx.fillStyle = '#666';
  octx.font = '28px -apple-system, Microsoft YaHei';
  octx.textAlign = 'center';
  octx.fillText(document.getElementById('cardHeader').textContent, 360, 80);

  // 菜名
  octx.fillStyle = '#f39c12';
  octx.font = 'bold 72px -apple-system, Microsoft YaHei';
  octx.fillText(document.getElementById('resultFood').textContent, 360, 200);

  // 心情
  octx.fillStyle = '#888';
  octx.font = '30px -apple-system, Microsoft YaHei';
  octx.fillText(document.getElementById('resultMood').textContent, 360, 260);

  // 分隔线
  octx.strokeStyle = '#2c3e50';
  octx.lineWidth = 2;
  octx.beginPath();
  octx.moveTo(60, 310); octx.lineTo(660, 310);
  octx.stroke();

  // 雷达信息
  octx.fillStyle = '#0f0f1a';
  octx.fillRect(60, 340, 600, 140);
  octx.strokeStyle = '#2c3e50';
  octx.strokeRect(60, 340, 600, 140);
  octx.fillStyle = '#888';
  octx.font = '28px -apple-system, Microsoft YaHei';
  const radar = document.getElementById('radarInfo').textContent;
  const lines = [];
  for (let i = 0; i < radar.length; i += 22) lines.push(radar.slice(i, i + 22));
  lines.forEach((l, i) => octx.fillText(l, 360, 395 + i * 42));

  // 成就
  const earned = BADGES.filter(b => b.check(history));
  octx.fillStyle = '#555';
  octx.font = '26px -apple-system, Microsoft YaHei';
  octx.fillText(`🏆 已收集 ${earned.length}/${BADGES.length} 个成就`, 360, 560);

  // 底部
  octx.fillStyle = '#333';
  octx.font = '24px -apple-system, Microsoft YaHei';
  octx.fillText('今天吃什么 🎡', 360, 650);
  octx.fillStyle = '#444';
  octx.font = '22px -apple-system, Microsoft YaHei';
  octx.fillText('帮你决定这餐吃什么的随机转盘', 360, 700);
  octx.fillStyle = '#555';
  octx.font = '20px -apple-system, Microsoft YaHei';
  octx.fillText('github.com/gaoxing968/what-to-eat', 360, 860);

  // 下载
  offCanvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `今天吃${currentFood}.png`;
    a.click();
    URL.revokeObjectURL(url);
  });
}

// ==================== 初始化转盘显示（空状态）================
function drawEmptyWheel() {
  ctx.clearRect(0, 0, 900, 900);
  const foods = ['先选心情', '', '', '', '', '', '', '', '', '', '', ''];
  drawWheel(foods);
  ctx.clearRect(0, 0, 900, 900);
  // 画一个灰转盘提示
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
  ctx.fillStyle = '#1a1a2e';
  ctx.fill();
  ctx.strokeStyle = '#2c3e50';
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(centerX, centerY, 65, 0, 2 * Math.PI);
  ctx.fillStyle = '#1a1a2e';
  ctx.fill();
  ctx.strokeStyle = '#e74c3c';
  ctx.lineWidth = 5;
  ctx.stroke();
  ctx.fillStyle = '#555';
  ctx.font = '22px -apple-system, Microsoft YaHei';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('选择心情', centerX, centerY);
}

// ==================== 事件绑定 ====================
// 心情选择
document.querySelectorAll('.mood-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    currentMood = btn.dataset.mood;
    setTimeout(() => {
      document.getElementById('moodPicker').classList.remove('show');
      showQuestion();
    }, 300);
  });
});

function showQuestion() {
  document.getElementById('qText').textContent = getRandomItem(QUESTIONS);
  document.getElementById('qAnswer').value = '';
  document.getElementById('questionBox').classList.add('show');
  document.getElementById('qAnswer').focus();
}

document.getElementById('startSpinBtn').addEventListener('click', () => {
  document.getElementById('questionBox').classList.remove('show');
  spin();
});

canvas.addEventListener('click', () => {
  if (!currentMood) {
    document.getElementById('moodPicker').classList.add('show');
  } else if (!isSpinning) {
    document.getElementById('questionBox').classList.add('show');
  }
});

document.getElementById('spinBtn').addEventListener('click', () => {
  if (!currentMood) {
    document.getElementById('moodPicker').classList.add('show');
  } else if (!isSpinning) {
    document.getElementById('questionBox').classList.add('show');
  }
});

document.getElementById('againBtn').addEventListener('click', () => {
  document.getElementById('resultModal').classList.remove('show');
  if (getTodaySpins() < 12) {
    document.getElementById('questionBox').classList.add('show');
  } else {
    alert('今天的12次机会用完啦！明天再来 🎲');
  }
});

document.getElementById('closeResultBtn').addEventListener('click', () => {
  document.getElementById('resultModal').classList.remove('show');
});

document.getElementById('saveCardBtn').addEventListener('click', saveCard);

document.getElementById('badgesBtn').addEventListener('click', () => {
  renderBadgePage();
  document.getElementById('badgePage').classList.add('show');
});

document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('badgePage').classList.remove('show');
});

// 回车开始转动
document.getElementById('qAnswer').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('startSpinBtn').click();
});

// ==================== 启动 ====================
drawEmptyWheel();
updateRemainCount();

// PWA: 注册 Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => {
    console.log('SW registered');
  }).catch(err => {
    console.warn('SW failed', err);
  });
}
</script>
